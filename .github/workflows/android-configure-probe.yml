name: Android native configure probe

on:
  workflow_dispatch:
  push:
    branches: [android-port]

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_PORT_PATCHSET_REV: "2"
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Checkout pinned Blender source
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: 73d7b5f6362f5fb1b16526854b920ab719d4c65a
          path: upstream/blender
          fetch-depth: 1
          lfs: false

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 cmake git-lfs

      - name: Install Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install pinned Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.31.6" \
            "ndk;30.0.16248370"

      - name: Verify pinned source
        run: |
          test "$(git -C upstream/blender rev-parse HEAD)" = "73d7b5f6362f5fb1b16526854b920ab719d4c65a"

      - name: Validate Android Vulkan headers and platform loader
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: |
          test -f "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan.h"
          test -f "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan/vulkan_android.h"
          find "$ANDROID_HOME/platforms" -name libvulkan.so -print -quit | grep -q .

      - name: Validate and apply Android source patches
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: |
          bash scripts/apply_android_patches.sh

      - name: Run Android CMake configure probe
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        run: bash scripts/configure_android_probe.sh
